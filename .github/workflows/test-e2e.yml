name: E2E Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  pull_request:
    paths-ignore:
      - '*.md'

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create Docker network for Kind
        run: docker network create kind || true

      - name: Start E2E infrastructure (registry + Gitea)
        run: docker compose -f test/e2e/docker-compose.yaml up -d --wait

      - name: Verify infrastructure is ready
        run: |
          echo "Waiting for registry..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/v2/ > /dev/null 2>&1; then
              echo "Registry is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 3
          done
          echo "Waiting for Gitea..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/version > /dev/null 2>&1; then
              echo "Gitea is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 3
          done

      - name: Running E2E Tests
        run: |
          go mod tidy
          make test-e2e-generic

      - name: Dump controller logs on failure
        if: failure()
        run: |
          echo "=== Detection Controller ==="
          kubectl logs -l control-plane=image-detection-controller -n image-resource-controller-system --tail=100 2>/dev/null || echo "No logs available"
          echo "=== Creation Controller ==="
          kubectl logs -l control-plane=resource-creation-controller -n image-resource-controller-system --tail=100 2>/dev/null || echo "No logs available"

      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name e2e-generic-registry 2>/dev/null || true
          docker compose -f test/e2e/docker-compose.yaml down -v 2>/dev/null || true
